<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>WhatsApp Inbox — All Clients</title>
<script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
<style>
  :root{
    --wa-green: #128C7E;
    --ink: #1F2328;
    --ink-soft: #6B7280;
    --line: #E5E7EB;
    --bg: #F7F8FA;
    --danger: #D64545;
    --warn: #C98A0A;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color:var(--ink); background:var(--bg);
  }
  #app{ max-width:1000px; margin:0 auto; padding:20px; }
  h1{ font-size:18px; margin:0 0 4px; }
  #controls{ display:flex; gap:10px; align-items:center; margin-bottom:18px; flex-wrap:wrap; }
  #controls select{
    padding:8px 10px; font-size:13px; border:1px solid var(--line); border-radius:8px;
    background:#fff; font-family:inherit;
  }
  #client-select{ font-weight:600; min-width:150px; }
  #refresh-btn{
    padding:8px 14px; font-size:13px; font-weight:600; border:1px solid var(--line); border-radius:8px;
    background:#fff; cursor:pointer; font-family:inherit;
  }
  #refresh-btn:hover{ background:var(--bg); }
  #refresh-btn:disabled{ opacity:0.5; cursor:default; }

  #empty{ text-align:center; color:var(--ink-soft); padding:60px 20px; font-size:14px; }
  #error{ color:var(--danger); padding:12px; background:#fff; border-radius:8px; margin-bottom:12px; }

  .row-wrapper{ margin-bottom:8px; }
  .row{
    display:flex; align-items:center; gap:14px; background:#fff; border:1px solid var(--line);
    border-radius:10px; padding:12px 14px;
  }
  .row.urgent{ border-color:var(--danger); background:#FFF6F5; }
  .row.soon{ border-color:var(--warn); background:#FFFAF0; }
  .row-wrapper:has(.inline-thread) .row{ border-radius:10px 10px 0 0; border-bottom:none; }

  .inline-thread{
    border:1px solid var(--line); border-top:none; border-radius:0 0 10px 10px;
    background:#fff; padding:10px 14px 12px;
  }
  .inline-thread-messages{
    max-height:220px; overflow-y:auto; display:flex; flex-direction:column; gap:6px;
    padding:8px; background:var(--bg); border-radius:8px; margin-bottom:6px;
  }
  .inline-bubble{
    max-width:75%; padding:6px 9px; border-radius:8px; font-size:12.5px; line-height:1.4;
    white-space:pre-wrap; word-break:break-word;
  }
  .inline-bubble.in{ align-self:flex-start; background:#fff; border:1px solid var(--line); }
  .inline-bubble.out{ align-self:flex-end; background:#DCF8C6; }
  .inline-thread-note{ font-size:10.5px; color:var(--ink-soft); margin-bottom:6px; }
  .inline-thread-composer{ display:flex; gap:8px; }
  .inline-thread-composer textarea{
    flex:1; resize:none; border:1px solid var(--line); border-radius:8px; padding:7px 9px;
    font-size:12.5px; font-family:inherit; min-height:34px;
  }
  .inline-thread-composer button{
    background:var(--wa-green); color:#fff; border:none; border-radius:8px; padding:7px 14px;
    font-size:12.5px; font-weight:600; cursor:pointer; flex-shrink:0;
  }
  .inline-thread-composer button:disabled{ opacity:0.5; cursor:default; }

  .client-section{ margin-bottom:20px; }
  .section-heading{
    font-size:14px; font-weight:700; margin-bottom:8px; padding-bottom:4px;
    border-bottom:2px solid var(--wa-green); color:var(--ink);
  }
  .section-empty{
    font-size:12.5px; color:var(--ink-soft); padding:10px 14px; background:#fff;
    border:1px solid var(--line); border-radius:10px;
  }
  .row-main{ flex:1; min-width:0; }
  .row-name{ font-size:13.5px; font-weight:600; }
  .row-preview{
    font-size:12px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .contact-info{ display:flex; gap:8px; margin-top:5px; flex-wrap:wrap; }
  .contact-chip{
    display:inline-flex; align-items:center; gap:4px; font-size:11px; color:var(--ink-soft);
    background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:2px 6px;
  }
  .contact-copy-btn{
    border:none; background:none; cursor:pointer; font-size:11px; padding:0 2px; line-height:1;
  }
  .contact-copy-btn:hover{ opacity:0.7; }
  .row-timer{ font-size:12px; font-weight:600; flex-shrink:0; text-align:right; min-width:90px; }
  .row-timer.urgent{ color:var(--danger); }
  .row-timer.soon{ color:var(--warn); }
  .row-timer.ok{ color:var(--ink-soft); }
  .row-timer .sub{ display:block; font-size:10px; font-weight:400; color:var(--ink-soft); }

  .row-link{
    background:var(--wa-green); color:#fff; text-decoration:none; font-size:12px; font-weight:600;
    padding:7px 12px; border-radius:6px; flex-shrink:0; white-space:nowrap;
  }
  .row-link.unmatched{ background:none; border:1px solid var(--line); color:var(--ink-soft); }

  #loading{ text-align:center; color:var(--ink-soft); padding:40px; font-size:13px; }
</style>
</head>
<body>
<div id="app">
  <h1>WhatsApp Inbox</h1>
  <div id="controls">
    <select id="client-select"></select>
    <select id="time-filter">
      <option value="all">All time</option>
      <option value="today">Today</option>
      <option value="3days">Last 3 days</option>
    </select>
    <button id="refresh-btn" type="button">🔄 Refresh</button>
  </div>
  <div id="error" style="display:none"></div>
  <div id="loading">Loading…</div>
  <div id="rows"></div>
</div>

<script>
/* =========================================================================
   CONFIG
   ========================================================================= */
var CONFIG = {
  ZOHO_CONNECTION_NAME: "zernio",
  ZERNIO_BASE_URL: "https://zernio.com/api/v1",
  APPS_SCRIPT_EXEC_URL: "https://script.google.com/macros/s/AKfycbz_8z2B0aDQNXgGdJUTsfGi7VdjYB9_TNU0cr0gd2fH_75HwGDTHg_vTlpeFvRY5XqEtg/exec",

  // Your Zoho CRM org — used to build direct links to each record.
  ORG_DOMAIN: "https://crm.zoho.in",
  ORG_ID: "60065333978",

  // One entry per client. urlSegment is the internal URL identifier Zoho
  // uses for that module in record links — NOT necessarily the API Name
  // for custom modules (confirmed by checking a real record URL; e.g.
  // Sharksports_lead's API Name but the URL uses "CustomModule1").
  CLIENTS: [
    { accountId: "6a7c18f977555aae01f0ec6b", module: "Leads", label: "Zomoz", urlSegment: "Leads" },
    { accountId: "6a5898a53d50078def9bb17c", module: "Sharksports_lead", label: "Shark Sports", urlSegment: "CustomModule1" },
    { accountId: "6a45af179d9472faae496281", module: "GoBIG_Lead", label: "GoBIG", urlSegment: "CustomModule2" }
  ],

  // Currently unused — auto-refresh is off, dashboard loads on open and via
  // the manual Refresh button only. Kept here so it's a one-line change to
  // re-enable later (add setInterval(loadDashboard, CONFIG.POLL_INTERVAL_MS)
  // back into the boot section at the bottom of the file).
  POLL_INTERVAL_MS: 20000
};

var $ = function(id){ return document.getElementById(id); };

/* =========================================================================
   ZERNIO — same pattern as the per-Lead widget, proven working
   ========================================================================= */
function zernioRequest(path, method, params){
  var httpMethod = method || "GET";
  var req = {
    url: CONFIG.ZERNIO_BASE_URL + path,
    method: httpMethod,
    param_type: httpMethod === "GET" ? 1 : 2
  };
  if(params) req.parameters = params;
  return ZOHO.CRM.CONNECTION.invoke(CONFIG.ZOHO_CONNECTION_NAME, req).then(function(resp){
    var body = resp && resp.details ? resp.details.statusMessage : resp;
    if(typeof body === "string"){
      try{ body = JSON.parse(body); }catch(e){ /* leave as string */ }
    }
    return body;
  });
}

function fetchUnreadConversations(client){
  return zernioRequest("/inbox/conversations", "GET", {
    accountId: client.accountId,
    platform: "whatsapp",
    limit: 50
  }).then(function(body){
    var all = (body && body.data) || [];
    return all.filter(function(c){ return (c.unreadCount || 0) > 0; });
  });
}

// Reuses the exact phone-search logic already proven in Code.gs, via the
// small relay added there — not an unverified client-side SDK search call.
function searchLead(module, phone){
  return fetch(CONFIG.APPS_SCRIPT_EXEC_URL + "?action=searchLead", {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ module: module, phone: phone })
  })
    .then(function(res){ return res.json(); })
    .then(function(json){ return json.id || null; });
}

/* =========================================================================
   TIME REMAINING IN THE 24H WINDOW
   Fixed bug: this used to read conv.updatedTime, the conversation's
   general last-activity timestamp — which shifts on ANY message, agent
   included, so sending a template made the timer look like it just
   reset even though it hadn't. Now finds the customer's actual last
   incoming message specifically, which is what WhatsApp's rule is
   really based on.
   ========================================================================= */
function lastIncomingMessage(messages){
  return messages
    .filter(function(m){ return m.direction === "incoming" || m.direction === "in"; })
    .sort(function(a, b){
      return new Date(b.createdAt || b.sentAt) - new Date(a.createdAt || a.sentAt);
    })[0];
}

function hoursRemainingFromMessages(messages){
  var last = lastIncomingMessage(messages);
  if(!last) return 24; // no incoming message found at all — shouldn't normally happen for a flagged conversation
  var lastMs = new Date(last.createdAt || last.sentAt).getTime();
  var elapsedMs = Date.now() - lastMs;
  return (24 * 60 * 60 * 1000 - elapsedMs) / (60 * 60 * 1000);
}

function urgencyClass(hrs){
  if(hrs <= 2) return "urgent";
  if(hrs <= 6) return "soon";
  return "ok";
}

function formatRemaining(hrs){
  if(hrs <= 0) return "Window closed";
  if(hrs < 1) return Math.round(hrs * 60) + " min left";
  return hrs.toFixed(1) + " hrs left";
}

/* =========================================================================
   TIME FILTER
   ========================================================================= */
function timeFilterCutoffMs(filterValue){
  if(filterValue === "today"){
    var midnight = new Date();
    midnight.setHours(0, 0, 0, 0);
    return midnight.getTime();
  }
  if(filterValue === "3days") return Date.now() - (3 * 24 * 60 * 60 * 1000);
  return 0; // "all" — no cutoff
}

/* =========================================================================
   LOAD + RENDER — one client at a time, picked via the dropdown
   ========================================================================= */
var currentClientIndex = 0;
var currentRawItems = []; // last fetch for the current client, before time filtering

function loadDashboard(){
  var client = CONFIG.CLIENTS[currentClientIndex];
  $("loading").style.display = "block";
  $("error").style.display = "none";
  $("refresh-btn").disabled = true;

  fetchUnreadConversations(client)
    .then(function(convs){
      // Back to parallel (not sequential) — the earlier slowdown was based
      // on a wrong diagnosis (thought this was a per-second rate limit; it
      // was actually Apps Script's daily UrlFetch quota, which pacing
      // requests over time does nothing for). Caching in handleSearchLead
      // now addresses the real cause, so there's no reason to stay slow.
      return Promise.all(convs.map(function(conv){
        return Promise.all([
          searchLead(client.module, conv.participantId),
          fetchThreadMessages(conv.id, client.accountId)
        ]).then(function(pair){
          var recordId = pair[0];
          var messages = pair[1];
          var item = { client: client, conv: conv, recordId: recordId };
          item.hrs = hoursRemainingFromMessages(messages);
          var lastIn = lastIncomingMessage(messages);
          item.updatedMs = lastIn
            ? new Date(lastIn.createdAt || lastIn.sentAt).getTime()
            : new Date(conv.updatedTime || conv.lastMessageAt).getTime(); // fallback only if no incoming message found
          return item;
        });
      }));
    })
    .then(function(items){
      currentRawItems = items;
      applyFilterAndRender();
    })
    .catch(function(err){
      console.error("Failed to load " + client.label + ":", err);
      $("loading").style.display = "none";
      $("error").style.display = "block";
      $("error").textContent = "Couldn't load " + client.label + "'s conversations.";
    })
    .finally(function(){ $("refresh-btn").disabled = false; });
}

function applyFilterAndRender(){
  var cutoff = timeFilterCutoffMs($("time-filter").value);
  var filtered = currentRawItems.filter(function(item){ return item.updatedMs >= cutoff; });
  filtered.sort(function(a, b){ return a.hrs - b.hrs; }); // most urgent first
  renderList(filtered);
}

// Same pattern as the attachment copy button in the per-Lead widget —
// clipboard API first, falling back to a native prompt() dialog for
// embedded WebViews that block scripted clipboard access outright.
function copyToClipboard(text, btn){
  var original = btn.textContent;
  function showCopied(){
    btn.textContent = "✓";
    setTimeout(function(){ btn.textContent = original; }, 1200);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(showCopied).catch(function(){
      prompt("Copy this value:", text);
    });
  }else{
    prompt("Copy this value:", text);
  }
}

// A "name" that's really just the phone number in disguise (common when
// no real contact name was ever set) isn't worth showing as a separate
// field — this checks whether the name is actually different from the
// phone digits before deciding to display + offer it as its own chip.
function isRealName(name, phoneDigits){
  if(!name) return false;
  return name.replace(/[^\d]/g, "") !== phoneDigits;
}

function buildContactChip(icon, value, copyLabel){
  var chip = document.createElement("span");
  chip.className = "contact-chip";
  var text = document.createElement("span");
  text.textContent = icon + " " + value;
  chip.appendChild(text);
  var btn = document.createElement("button");
  btn.type = "button";
  btn.className = "contact-copy-btn";
  btn.textContent = "📋";
  btn.title = "Copy " + copyLabel;
  btn.addEventListener("click", function(){ copyToClipboard(value, btn); });
  chip.appendChild(btn);
  return chip;
}

function buildRow(item){
  var cls = urgencyClass(item.hrs);
  var wrapper = document.createElement("div");
  wrapper.className = "row-wrapper";

  var row = document.createElement("div");
  row.className = "row " + cls;

  var main = document.createElement("div");
  main.className = "row-main";
  var name = document.createElement("div");
  name.className = "row-name";
  name.textContent = item.conv.participantName || item.conv.participantUsername || item.conv.participantId;
  var preview = document.createElement("div");
  preview.className = "row-preview";
  preview.textContent = item.conv.lastMessage || "";
  main.appendChild(name);
  main.appendChild(preview);

  if(!item.recordId){
    var contactInfo = document.createElement("div");
    contactInfo.className = "contact-info";
    var phone = "+" + item.conv.participantId;
    contactInfo.appendChild(buildContactChip("📞", phone, "phone number"));
    if(isRealName(item.conv.participantName, item.conv.participantId)){
      contactInfo.appendChild(buildContactChip("👤", item.conv.participantName, "name"));
    }
    main.appendChild(contactInfo);
  }

  row.appendChild(main);

  var timer = document.createElement("div");
  timer.className = "row-timer " + cls;
  timer.textContent = formatRemaining(item.hrs);
  row.appendChild(timer);

  var link = document.createElement("a");
  if(item.recordId){
    link.href = CONFIG.ORG_DOMAIN + "/crm/org" + CONFIG.ORG_ID + "/tab/" +
      item.client.urlSegment + "/" + item.recordId;
    link.target = "_blank";
    link.rel = "noopener";
    link.className = "row-link";
    link.textContent = "Open Lead →";
  }else{
    link.className = "row-link unmatched";
    link.textContent = "View & Reply";
    link.href = "#";
    link.addEventListener("click", function(e){
      e.preventDefault();
      toggleInlineThread(item, wrapper);
    });
  }
  row.appendChild(link);
  wrapper.appendChild(row);

  return wrapper;
}

function fetchThreadMessages(conversationId, accountId){
  return zernioRequest("/inbox/conversations/" + conversationId + "/messages", "GET", { accountId: accountId })
    .then(function(body){ return (body && body.messages) || []; });
}

function sendThreadMessage(conversationId, accountId, text){
  return zernioRequest("/inbox/conversations/" + conversationId + "/messages", "POST", {
    accountId: accountId, message: text
  });
}

function toggleInlineThread(item, wrapper){
  var existing = wrapper.querySelector(".inline-thread");
  if(existing){ existing.remove(); return; }

  var panel = document.createElement("div");
  panel.className = "inline-thread";
  panel.innerHTML =
    '<div class="inline-thread-messages">Loading…</div>' +
    '<div class="inline-thread-note">Quick replies only — outside the 24-hour window this needs a template, ' +
    'which isn\'t available from this quick panel. Create the Lead in CRM for full template support.</div>' +
    '<div class="inline-thread-composer">' +
      '<textarea placeholder="Type a reply…" rows="1"></textarea>' +
      '<button type="button">Send</button>' +
    '</div>';
  wrapper.appendChild(panel);

  var messagesEl = panel.querySelector(".inline-thread-messages");
  var textarea = panel.querySelector("textarea");
  var sendBtn = panel.querySelector("button");

  function loadThread(){
    fetchThreadMessages(item.conv.id, item.client.accountId).then(function(messages){
      messagesEl.innerHTML = "";
      messages.slice(-15).forEach(function(m){ // most recent 15 — quick glance, not full history
        var dir = (m.direction === "outgoing" || m.direction === "out") ? "out" : "in";
        var b = document.createElement("div");
        b.className = "inline-bubble " + dir;
        b.textContent = m.text || m.message || (m.attachments && m.attachments.length ? "[attachment]" : "");
        messagesEl.appendChild(b);
      });
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }).catch(function(err){
      console.error(err);
      messagesEl.textContent = "Couldn't load messages.";
    });
  }
  loadThread();

  sendBtn.addEventListener("click", function(){
    var text = textarea.value.trim();
    if(!text) return;
    sendBtn.disabled = true;
    sendThreadMessage(item.conv.id, item.client.accountId, text)
      .then(function(){
        textarea.value = "";
        return loadThread();
      })
      .catch(function(err){
        console.error(err);
        alert("Message failed to send — likely outside the 24-hour window, which needs a template (not supported in this quick-reply panel).");
      })
      .finally(function(){ sendBtn.disabled = false; });
  });
}

function renderList(items){
  $("loading").style.display = "none";
  var container = $("rows");
  container.innerHTML = "";
  var client = CONFIG.CLIENTS[currentClientIndex];

  var heading = document.createElement("div");
  heading.className = "section-heading";
  heading.textContent = client.label + " (" + items.length + ")";
  container.appendChild(heading);

  if(!items.length){
    var none = document.createElement("div");
    none.className = "section-empty";
    none.textContent = "All caught up";
    container.appendChild(none);
    return;
  }
  items.forEach(function(item){ container.appendChild(buildRow(item)); });
}

/* =========================================================================
   CONTROLS
   ========================================================================= */
function populateClientDropdown(){
  var select = $("client-select");
  CONFIG.CLIENTS.forEach(function(client, i){
    var opt = document.createElement("option");
    opt.value = i;
    opt.textContent = client.label;
    select.appendChild(opt);
  });
}

$("client-select").addEventListener("change", function(){
  currentClientIndex = parseInt(this.value, 10);
  loadDashboard(); // switching brands fetches fresh data for that client
});

$("time-filter").addEventListener("change", applyFilterAndRender); // no re-fetch needed, just re-filter what's already loaded

$("refresh-btn").addEventListener("click", loadDashboard);

/* =========================================================================
   BOOT
   ========================================================================= */
ZOHO.embeddedApp.on("PageLoad", function(){
  populateClientDropdown();
  loadDashboard(); // manual only — no auto-poll; use the 🔄 Refresh button
});
ZOHO.embeddedApp.init();
</script>
</body>
</html>
